<style>
/* Layout: one-screen app — sticky top bar, scrolling main, fixed bottom tab bar. Each game wears its own material: walnut chess, lacquer xiangqi, felt poker, ticker amber for markets. */
:root{
  --bg:#11141c; --panel:#1a1e29; --panel2:#222736; --line:#2d3344; --fg:#ece9e1; --mute:#9aa1b4;
  --accent:#f0b545; --accent-ink:#1b1405;
  --good:#4cc08a; --ok:#8fc0e8; --warn:#e9a53c; --bad:#ec6a5f;
  --sq-l:#e8dcc0; --sq-d:#9a7651; --sq-sel:#f2cf5b; --sq-last:rgba(240,181,69,.45);
  --xq-board:#e7c58c; --xq-line:#5a3716; --xq-red:#b3261e; --xq-blk:#1d1f24; --xq-face:#f6ead2;
  --felt:#155b43; --felt-edge:#0c3a2a;
  --card:#fbfaf6; --card-red:#c4262e; --card-blk:#15171c;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --chess:"Noto Sans Symbols 2","Segoe UI Symbol","Apple Symbols",sans-serif;
  --han:"Noto Serif SC","Songti SC","PingFang SC",serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eef0f4; --panel:#ffffff; --panel2:#f3f4f8; --line:#d9dce5; --fg:#151925; --mute:#5c6478;
  --accent:#c98a12; --accent-ink:#ffffff; --good:#1f8a5b; --ok:#2f6fa8; --warn:#b06d07; --bad:#c7392f; --sq-last:rgba(201,138,18,.4);
  color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#eef0f4; --panel:#ffffff; --panel2:#f3f4f8; --line:#d9dce5; --fg:#151925; --mute:#5c6478;
  --accent:#c98a12; --accent-ink:#ffffff; --good:#1f8a5b; --ok:#2f6fa8; --warn:#b06d07; --bad:#c7392f; --sq-last:rgba(201,138,18,.4);
  color-scheme:light;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
#app{display:flex;flex-direction:column;height:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.back{background:none;border:0;color:var(--fg);font-size:22px;padding:0 6px 0 0;cursor:pointer;line-height:1}
.crumb{font-family:var(--display);font-weight:600;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{margin-left:auto;font-family:var(--mono);font-size:13px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute);font-variant-numeric:tabular-nums;background:var(--panel)}
.timer.low{color:var(--warn);border-color:var(--warn)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;color:var(--mute);padding:9px 0 8px;font:500 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .ic{font-size:21px;line-height:1.1;font-family:var(--chess)}
nav.tabs button .ic.han{font-family:var(--han);font-weight:700;font-size:18px}
nav.tabs button[aria-current="true"]{color:var(--accent)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:13px}
.eyebrow{font:600 11px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:11px;padding:11px 14px;font:600 15px var(--body);cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;width:100%}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--mute)}
.item .end{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--mute);white-space:nowrap}
.item.locked{opacity:.5;cursor:default}
.item.done .end{color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--body);padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.acc{color:var(--accent);border-color:var(--accent)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:12px 10px}
.bar{height:6px;border-radius:6px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.coach{border-left:4px solid var(--line);background:var(--panel);border-radius:4px 12px 12px 4px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.coach.good{border-left-color:var(--good)}.coach.ok{border-left-color:var(--ok)}.coach.warn{border-left-color:var(--warn)}.coach.bad{border-left-color:var(--bad)}
.coach .h{display:flex;gap:8px;align-items:center;font-weight:600}
.coach p{font-size:14.5px}
.simp{display:none;align-self:flex-start}.can-simp .simp{display:inline-flex}.simp[hidden]{display:none!important}
.simpout{background:var(--panel2);border-radius:8px;padding:8px 10px;line-height:1.5}
.mono{font-family:var(--mono)}
.prose{display:flex;flex-direction:column;gap:9px;max-width:65ch}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:600 13px var(--body);padding:8px 4px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.moves{font-family:var(--mono);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 10px;max-height:96px;overflow-y:auto}
.moves span.q-good{color:var(--good)}.moves span.q-ok{color:var(--ok)}.moves span.q-warn{color:var(--warn)}.moves span.q-bad{color:var(--bad)}
.thinking{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.thinking::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- chess board ---------- */
.cboard{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));grid-auto-rows:0;width:100%;max-width:460px;aspect-ratio:1;margin:0 auto;border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px #4b3622, 0 6px 20px rgba(0,0,0,.25);user-select:none;touch-action:manipulation}
.sq{position:relative;border:0;padding:0;margin:0;min-width:0;min-height:0;width:100%;height:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:0;font:inherit;overflow:hidden;-webkit-appearance:none;appearance:none;border-radius:0;background-clip:padding-box}
.sq.l{background:var(--sq-l)}.sq.d{background:var(--sq-d)}
.sq.last::after{content:"";position:absolute;inset:0;background:var(--sq-last)}
.sq.sel::after{content:"";position:absolute;inset:0;background:rgba(242,207,91,.65)}
.sq.hint::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 4px #2f8fdc}
.sq.chk::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(236,60,50,.85) 0,rgba(236,60,50,0) 70%)}
.sq.wrong::after{content:"";position:absolute;inset:0;background:rgba(236,90,80,.55)}
.sq.right::after{content:"";position:absolute;inset:0;background:rgba(70,190,130,.55)}
.sq .pc{position:relative;z-index:2;width:100%;height:100%;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.sq .dot{position:absolute;z-index:3;width:28%;height:28%;border-radius:50%;background:rgba(30,30,30,.32)}
.sq .ring{position:absolute;z-index:3;inset:6%;border-radius:50%;border:4px solid rgba(30,30,30,.32)}
.sq .co{position:absolute;font:600 9px var(--body);z-index:1;opacity:.75}
.sq .co.f{right:3px;bottom:1px}.sq .co.r{left:3px;top:2px}
.sq.l .co{color:var(--sq-d)}.sq.d .co{color:var(--sq-l)}

/* ---------- xiangqi board ---------- */
.xqwrap{width:100%;max-width:440px;margin:0 auto;background:var(--xq-board);border-radius:8px;padding:2.2%;box-shadow:0 6px 20px rgba(0,0,0,.25), inset 0 0 0 2px #b88c4c}
.xqb{position:relative;width:100%;aspect-ratio:9/10;user-select:none;touch-action:manipulation}
.xqb svg{position:absolute;inset:0;width:100%;height:100%}
.xqb svg *{stroke:var(--xq-line);fill:none}
.xqb svg text{fill:var(--xq-line);stroke:none;font-family:var(--han);font-weight:700}
.xpt{position:absolute;width:11.111%;height:10%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer}
.xpc{width:88%;aspect-ratio:1;border-radius:50%;background:var(--xq-face);display:flex;align-items:center;justify-content:center;font-family:var(--han);font-weight:700;font-size:min(5.6vw,26px);box-shadow:0 2px 0 rgba(0,0,0,.35), inset 0 0 0 2px currentColor, inset 0 0 0 4px var(--xq-face), inset 0 0 0 5px currentColor;position:relative}
.xpc.r{color:var(--xq-red)}.xpc.b{color:var(--xq-blk)}
.xpc .en{position:absolute;bottom:-3px;right:-3px;font:700 9px var(--body);background:currentColor;border-radius:4px;padding:0 3px;line-height:13px}
.xpc .en span{color:var(--xq-face)}
.xpt.sel .xpc{box-shadow:0 0 0 3px #2f8fdc, inset 0 0 0 2px currentColor, inset 0 0 0 4px var(--xq-face), inset 0 0 0 5px currentColor}
.xpt.last::before{content:"";position:absolute;width:40%;height:40%;border:2px dashed #2f8fdc;border-radius:4px}
.xpt.hint .xpc,.xpt.hint::before{outline:3px solid #2f8fdc;outline-offset:1px}
.xpt.chk .xpc{box-shadow:0 0 0 4px #e33}
.xpt .dot{width:26%;height:26%;border-radius:50%;background:rgba(30,90,170,.55)}
.xpt .xpc + .dot{position:absolute;width:90%;height:90%;background:none;border:3px solid rgba(30,90,170,.7)}

/* ---------- poker ---------- */
.pcard{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:46px;height:64px;border-radius:7px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.35);font-family:var(--display);font-weight:700;line-height:1;gap:2px;flex:none}
.pcard .r{font-size:21px}.pcard .s{font-size:19px}
.pcard.red{color:var(--card-red)}.pcard.blk{color:var(--card-blk)}
.pcard.back{background:repeating-linear-gradient(45deg,#8c2b2b 0 5px,#a33a3a 5px 10px);border:3px solid #f4efe6}
.pcard.dim{opacity:.35}
.pcard.big{width:56px;height:78px}.pcard.big .r{font-size:26px}
.cards{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.table{background:radial-gradient(ellipse at center,var(--felt) 0,var(--felt-edge) 100%);border-radius:28px;border:6px solid #3b2516;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center;color:#f2efe6}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px}
.seat .nm{font:600 13px var(--body);display:flex;gap:8px;align-items:center}
.chips{font-family:var(--mono);font-size:13px;background:rgba(0,0,0,.3);padding:2px 9px;border-radius:99px}
.pot{font-family:var(--mono);font-size:15px;background:rgba(0,0,0,.35);padding:4px 12px;border-radius:99px}
.betchip{font-family:var(--mono);font-size:12px;color:#ffd977}
.dealer{display:inline-block;width:20px;height:20px;border-radius:50%;background:#f4efe6;color:#111;font:700 11px/20px var(--body);text-align:center}
.pkctl{display:flex;flex-direction:column;gap:8px}
@media (orientation: landscape) and (max-height:500px){
  .pkplay{display:grid!important;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start}
  .table{border-radius:120px;padding:10px 24px;gap:8px}
  .pcard{width:40px;height:56px}.pcard .r{font-size:18px}
  main{padding-bottom:80px}
  nav.tabs button{padding:5px 0 4px}
}

/* ---------- markets ---------- */
.chart{width:100%;height:180px;display:block}
.chart line.g{stroke:var(--line)}
.opt{width:100%;text-align:left}
.opt.right{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.opt.idk{background:transparent;border-style:dashed;color:var(--mute);text-align:center}
.opt.idk.wrong{border-color:var(--line);color:var(--mute)}
.right ~ .idk:not(.wrong),.list:has(.right) .idk:not(.wrong),#qq:has(.right) .idk:not(.wrong){display:none}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,7,12,.6);display:flex;align-items:flex-end;justify-content:center;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88%;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);align-self:center}
</style>
