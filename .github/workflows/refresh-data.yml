name: Weekly market data refresh

on:
  schedule:
    # Sundays 7:05 PM ET (23:05 UTC in winter, 00:05 UTC Monday in summer)
    - cron: "5 23 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q yfinance

      - name: Regenerate mktdata.js and tapedata.js
